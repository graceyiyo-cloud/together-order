<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>團購接龍</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./group-buy.css"><script type="module" src="./group-buy.js"></script></head>
<body><main><header><a id="home" href="#">團購接龍</a><a id="new" class="button" href="#new">開新團</a></header><p id="message" role="status" hidden></p>
<section id="list"><h1>目前的團購</h1><div id="cards">載入中…</div></section>
<section id="create" hidden><a href="#">‹ 全部團購</a><h1>開新團</h1><form id="create-form">
<label>團購名稱<input name="title" required maxlength="160" placeholder="例如：黃色小蕃茄（小農）訂購"></label>
<label>團購備註<textarea name="notes" maxlength="3000" rows="3" placeholder="送達日期、收單時間、規格或取貨方式"></textarea></label>
<fieldset><legend>訂購品項</legend><div id="products"></div><button type="button" id="add">新增品項</button></fieldset>
<label>上傳菜單（選填）<input type="file" name="menu" accept="image/jpeg,image/png,image/webp,application/pdf"><small>JPG、PNG、WebP 或 PDF，最多 8 MB</small></label>
<button class="primary">開始收單</button></form></section>
<section id="detail" hidden><a href="#">‹ 全部團購</a><h1 id="title"></h1><p id="notes"></p><a id="menu" target="_blank" rel="noopener" hidden>查看菜單 ↗</a>
<div class="cols"><form id="join"><h2>我要跟團</h2><label>姓名<input name="name" maxlength="40" required autocomplete="name"></label><div id="choices"></div><div class="total">本次金額 <strong id="subtotal">0 元</strong></div><button class="primary">加入接龍</button></form>
<article><div class="bar"><h2>團購接龍</h2><button id="copy">複製接龍</button></div><p id="stats"></p><pre id="chain"></pre></article></div></section></main></body></html>
