<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>團購接龍</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./group-buy.css?v=controls1"><script type="module" src="./group-buy.js?v=controls1"></script></head>
<body><main><header><a id="home" href="#">團購接龍</a><a id="new" class="button" href="#new">開新團</a></header><p id="message" role="status" hidden></p>
<section id="list"><div class="list-heading"><h1 id="list-title">目前的團購</h1><nav class="tabs" aria-label="團購清單"><a id="active-tab" href="#">目前團購</a><a id="history-tab" href="#history">歷史清單</a></nav></div><div id="cards">載入中…</div></section>
<section id="create" hidden><a id="form-back" href="#">全部團購</a><h1 id="group-heading">開新團</h1><form id="create-form">
<label>團購名稱<input name="title" required maxlength="160" placeholder="例如：黃色小蕃茄（小農）訂購"></label>
<fieldset class="deadline-picker"><legend>截止日期與時間（台灣）</legend></fieldset><label>團購備註<textarea name="notes" maxlength="3000" rows="3" placeholder="送達日期、收單時間、規格或取貨方式"></textarea></label>
<fieldset><legend>預設品項（選填）</legend><div id="products"></div><button type="button" id="add">新增品項</button></fieldset>
<label>上傳菜單（選填）<input type="file" name="menu" accept="image/jpeg,image/png,image/webp,application/pdf"><small>JPG、PNG、WebP 或 PDF，最多 8 MB</small></label>
<label id="remove-menu-label" hidden><span><input type="checkbox" name="removeMenu"> 移除現有菜單</span></label><small id="price-note" hidden>更改單價後，依品項填寫的接龍會按新單價計算。</small><button id="save-group" class="primary">開始收單</button></form></section>
<section id="restart-page" hidden><a id="restart-back">返回團購</a><h1>重新開團</h1><form id="restart-form"><strong id="restart-title"></strong><p>沿用團名、備註、品項和菜單。上一輪接龍會保存在歷史清單，新一輪從空白開始。</p><fieldset class="deadline-picker"><legend>新一輪截止日期與時間（台灣）</legend></fieldset><button class="primary">開始新一輪</button></form></section>
<section id="detail" hidden><a id="detail-back" href="#">全部團購</a><div class="bar"><h1 id="title"></h1><a id="edit-group" data-edit>編輯團購</a></div><a id="entry-back" hidden>取消修改</a><div class="round-toolbar"><div id="round-status" class="round-info"></div><button id="quick-summary" type="button">查看品項整理</button></div><p id="notes"></p><section id="menu" hidden>
<button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel">展開菜單</button>
<div id="menu-panel" hidden><p id="menu-status" role="status"></p><div id="menu-content"></div>
<div id="menu-pages" hidden><button type="button" id="menu-prev">上一頁</button><span id="menu-page" aria-live="polite"></span><button type="button" id="menu-next">下一頁</button></div></div>
</section>
<div class="cols"><div id="entry-forms"><form id="join"><h2>依品項填數量</h2><label>姓名<input name="name" maxlength="40" required autocomplete="name"></label><div id="choices"></div><div class="total">本次金額 <strong id="subtotal">0 元</strong></div><button id="submit-quantity" class="primary">加入接龍</button></form><form id="paste-form"><h2>整段貼上訂單</h2><label>訂單內容<textarea id="paste" rows="6" maxlength="25000" required placeholder="姓名&#10;411 XO小卷醬 NT$ 320&#10;總金額 NT$ 320"></textarea></label><output id="preview" aria-live="polite"></output><button id="send-paste" class="primary" disabled>確認加入接龍</button></form></div>
<article id="results"><div class="bar"><h2>團購結果</h2><button id="copy">複製接龍</button></div><p id="stats"></p><div class="tabs" role="group" aria-label="結果顯示方式"><button id="chain-tab" aria-pressed="true">接龍明細</button><button id="summary-tab" aria-pressed="false">品項整理</button></div><div id="chain"></div><div id="summary" hidden></div></article></div><div id="manage" class="manage"><button type="button" id="close-round">立即截單</button><button type="button" id="archive-round">移至歷史清單</button><a class="button" id="restart-round">重新開團</a></div></section></main></body></html>
